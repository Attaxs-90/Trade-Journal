<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<link rel="stylesheet" href="vendor/quill.snow.css">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    const theme = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
    const font = localStorage.getItem("fontOption") || "system";
    document.documentElement.setAttribute("data-font", font);
    if (localStorage.getItem("sidebarCollapsed") === "true") {
      document.documentElement.setAttribute("data-sidebar", "collapsed");
    }
    if (localStorage.getItem("newsbarCollapsed") === "true") {
      document.documentElement.setAttribute("data-newsbar", "collapsed");
    }
  })();
</script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-text">Trade Journal</span>
      <div class="brand-actions">
        <button class="brand-icon-btn theme-toggle" id="theme-toggle" title="Theme wechseln">🌙</button>
        <button class="brand-icon-btn sync-btn" id="global-sync-btn" title="Alle Konten synchronisieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="brand-icon-btn sidebar-collapse-btn" id="sidebar-collapse" title="Sidebar ein-/ausklappen">
          <span class="collapse-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
        </button>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="overview" title="Übersicht">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></svg></span>
        <span class="nav-label">Übersicht</span>
      </button>
      <button class="nav-item" data-view="trades" title="Trades">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><circle cx="7" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg></span>
        <span class="nav-label">Trades</span>
      </button>
      <button class="nav-item" data-view="journal" title="Journal">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="11.5" y1="7" x2="15.5" y2="7"/><line x1="11.5" y1="11" x2="15.5" y2="11"/></svg></span>
        <span class="nav-label">Journal</span>
      </button>
      <button class="nav-item" data-view="month" title="Monatsübersicht">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <span class="nav-label">Monatsübersicht</span>
      </button>
      <button class="nav-item" data-view="accounts" title="Konten &amp; Sync">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
        <span class="nav-label">Konten &amp; Sync</span>
      </button>
      <button class="nav-item" data-view="settings" title="Einstellungen">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
        <span class="nav-label">Einstellungen</span>
      </button>
    </nav>

    <div class="import-box">
      <label class="import-label" for="csv-input">CSV importieren</label>
      <select class="import-account-select" id="import-account-select">
        <option value="">Kein Konto (freier Import)</option>
      </select>
      <input type="file" id="csv-input" accept=".csv" hidden>
      <button class="btn btn-primary" id="import-btn">Datei wählen</button>
      <div class="import-status" id="import-status"></div>
    </div>
  </aside>

  <main class="content" id="content">
    <!-- dynamisch befüllt -->
  </main>

  <aside class="newsbar" id="newsbar">
    <div class="newsbar-header">
      <span class="newsbar-icon" title="Marktnews">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M20 20a3 3 0 0 1-3-3V8h3"/><line x1="8" y1="8.5" x2="14" y2="8.5"/><line x1="8" y1="12" x2="14" y2="12"/><line x1="8" y1="15.5" x2="12" y2="15.5"/></svg>
      </span>
      <span class="newsbar-title">Marktnews</span>
      <button class="newsbar-filter-btn" id="newsbar-filter-btn" title="Filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>
      </button>
      <button class="newsbar-collapse-btn" id="newsbar-collapse" title="Newsbar ein-/ausklappen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="newsbar-filter-panel" id="newsbar-filter-panel" hidden>
      <div class="newsbar-filter-group">
        <div class="newsbar-filter-group-title">
          Expected Impact (<a href="#" data-filter="impact" data-mode="all">all</a>, <a href="#" data-filter="impact" data-mode="none">none</a>)
        </div>
        <div class="newsbar-chip-row" id="newsbar-filter-impact"></div>
      </div>
      <div class="newsbar-filter-group">
        <div class="newsbar-filter-group-title">
          Event Types (<a href="#" data-filter="type" data-mode="all">all</a>, <a href="#" data-filter="type" data-mode="none">none</a>)
        </div>
        <div class="newsbar-chip-row" id="newsbar-filter-types"></div>
      </div>
      <div class="newsbar-filter-group">
        <div class="newsbar-filter-group-title">
          Currencies (<a href="#" data-filter="currency" data-mode="all">all</a>, <a href="#" data-filter="currency" data-mode="none">none</a>)
        </div>
        <div class="newsbar-chip-row" id="newsbar-filter-currencies"></div>
      </div>
    </div>

    <div class="newsbar-body" id="newsbar-body">
      <div class="newsbar-section">
        <div class="newsbar-section-title">Diese Woche (Mo–Fr)</div>
        <div class="newsbar-list" id="news-upcoming"></div>
      </div>
      <div class="newsbar-section">
        <div class="newsbar-section-title newsbar-section-title-toggle">
          <span>Nächste Woche (Mo–Fr)</span>
          <button type="button" class="newsbar-section-toggle" id="news-nextweek-toggle" title="Nächste Woche ein-/ausblenden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="newsbar-list" id="news-nextweek"></div>
      </div>
      <div class="newsbar-section">
        <div class="newsbar-section-title">Bereits veröffentlicht heute</div>
        <div class="newsbar-list" id="news-hot"></div>
      </div>
      <div class="newsbar-section">
        <div class="newsbar-section-title newsbar-section-title-toggle">
          <span>Historie</span>
          <button type="button" class="newsbar-section-toggle" id="news-history-toggle" title="Historie ein-/ausblenden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="newsbar-list" id="news-history"></div>
      </div>
    </div>
  </aside>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="lightbox-overlay" id="lightbox-overlay">
  <div class="lightbox-box" id="lightbox-box">
    <button class="modal-close lightbox-close" id="lightbox-close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <div class="lightbox-toolbar">
      <button class="btn btn-secondary" id="lightbox-save">Größe speichern</button>
      <button class="btn btn-secondary" id="lightbox-reset">Standardgröße</button>
      <button class="btn btn-secondary" id="lightbox-delete">Löschen</button>
    </div>
    <div class="lightbox-handle" id="lightbox-handle" title="Ziehen zum Vergrößern (zentriert)"></div>
  </div>
</div>

<div class="tag-popover" id="tag-popover" hidden>
  <div class="tag-popover-list" id="tag-popover-list"></div>
  <div class="tag-popover-empty" id="tag-popover-empty" hidden>Noch keine Tags angelegt - siehe Einstellungen &gt; Tags.</div>
</div>

<template id="tpl-overview">
  <section class="view">
    <header class="view-header">
      <h1>Übersicht</h1>
    </header>

    <div class="stat-grid" id="ov-stats"></div>

    <div class="card">
      <div class="card-title">Equity-Kurve (kumuliert, alle Tage)</div>
      <div class="chart-wrap" id="ov-chart"></div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title">Tage im Überblick</div>
        <div class="card-title-actions">
          <div class="inline-filter" id="ov-columns-filter">
            <button type="button" class="inline-filter-toggle" id="ov-columns-toggle">Spalten</button>
            <div class="inline-filter-panel" id="ov-columns-panel" hidden></div>
          </div>
          <div class="inline-filter" id="ov-account-filter">
            <button type="button" class="inline-filter-toggle" id="ov-account-filter-toggle">Konten-Filter <span class="inline-filter-count" id="ov-account-filter-count"></span></button>
            <div class="inline-filter-panel" id="ov-account-filter-panel" hidden></div>
          </div>
        </div>
      </div>
      <table class="table" id="ov-days-table">
        <thead>
          <tr>
            <th data-col="date">Datum</th><th data-col="account">Konto</th><th data-col="volume">Größe</th>
            <th data-col="trades">Trades</th><th data-col="points">Punkte</th><th data-col="net">Netto $</th>
            <th data-col="journal">Journal</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</template>

<template id="tpl-trades">
  <section class="view">
    <header class="view-header">
      <h1>Trades</h1>
    </header>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title">Alle Trades</div>
        <div class="tag-logic-toggle" id="trades-tag-logic-toggle">
          <button type="button" class="tag-logic-btn active" data-logic="or">ODER</button>
          <button type="button" class="tag-logic-btn" data-logic="and">UND</button>
        </div>
      </div>
      <div class="filter-list filter-list-inline" id="trades-tag-filter-list"></div>
      <div class="table-scroll">
        <table class="table trades-table">
          <thead>
            <tr>
              <th>Datum</th><th>Konto</th><th>Entry-Zeit</th><th>Richtung</th><th>Größe</th><th>Entry</th>
              <th>Exit</th><th>Punkte</th><th>Netto $</th><th>Tags</th>
            </tr>
          </thead>
          <tbody id="trades-tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="trades-pagination"></div>
    </div>
  </section>
</template>

<template id="tpl-day">
  <section class="view">
    <header class="view-header">
      <h1 class="day-title">Tag</h1>
    </header>

    <div class="stat-grid day-stats"></div>

    <div class="card">
      <div class="card-title">Trades</div>
      <div class="bulk-tag-bar" hidden>
        <span class="bulk-tag-count"></span>
        <select class="bulk-tag-select"></select>
        <button type="button" class="btn btn-secondary bulk-tag-apply">Tag zuweisen</button>
      </div>
      <div class="table-scroll">
        <table class="table day-table">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" class="day-table-select-all"></th>
              <th>Entry-Zeit</th><th>Exit-Zeit</th><th>Richtung</th><th>Größe</th><th>Entry</th>
              <th>Exit</th><th>Exit-Typ</th><th>Punkte</th><th>Netto $</th><th>Kumuliert</th><th>Tags</th><th>Notiz</th><th>Bild</th><th>Löschen</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Beobachtungen</div>
      <div class="obs-grid day-observations"></div>
    </div>

    <div class="card">
      <div class="card-title">Bilder (Tag)</div>
      <div class="image-strip day-images"></div>
      <label class="btn btn-secondary image-upload-btn">
        + Bild hinzufügen
        <input type="file" accept="image/*" class="day-image-input" hidden>
      </label>
    </div>

    <div class="card">
      <div class="card-title">Journal</div>
      <div class="journal-editor-host day-journal"></div>
    </div>
  </section>
</template>

<template id="tpl-journal">
  <section class="view">
    <header class="view-header">
      <h1>Journal</h1>
      <div class="journal-new">
        <input type="date" id="journal-new-date">
        <button type="button" class="btn btn-primary" id="journal-new-btn">+ Eintrag</button>
      </div>
    </header>

    <div class="journal-layout">
      <aside class="journal-list-pane">
        <input type="search" id="journal-search" class="journal-search" placeholder="Volltextsuche…">
        <div class="newsbar-chip-row journal-mode-row" id="journal-mode-chips"></div>
        <div class="inline-filter journal-tag-filter">
          <button type="button" class="inline-filter-toggle" id="journal-tag-toggle">
            Tags <span class="inline-filter-count" id="journal-tag-count"></span>
          </button>
          <div class="inline-filter-panel" id="journal-tag-panel" hidden></div>
        </div>
        <div class="journal-bulk-bar" id="journal-bulk-bar" hidden>
          <span class="journal-bulk-count" id="journal-bulk-count"></span>
          <button type="button" class="btn btn-secondary journal-bulk-clear">Auswahl aufheben</button>
          <button type="button" class="btn btn-danger journal-bulk-delete">Löschen</button>
        </div>
        <div class="journal-list" id="journal-list"></div>
      </aside>

      <div class="journal-editor-pane">
        <div class="journal-editor-host" id="journal-page-host"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-month">
  <section class="view">
    <header class="view-header">
      <h1>Monatsübersicht</h1>
      <div class="month-picker">
        <button class="btn btn-secondary month-prev">←</button>
        <div class="month-label">Monat</div>
        <button class="btn btn-secondary month-next">→</button>
      </div>
    </header>

    <div class="stat-grid month-stats"></div>

    <div class="card">
      <div class="card-title">Tage</div>
      <div class="month-grid"></div>
    </div>
  </section>
</template>

<template id="tpl-accounts">
  <section class="view">
    <header class="view-header">
      <h1>Konten &amp; Sync</h1>
    </header>

    <div class="card">
      <div class="card-title">Konto hinzufügen</div>
      <form class="account-form" id="account-form">
        <input type="text" name="name" placeholder="Bezeichnung (z. B. Lucid Trading)" required>
        <select name="platform" id="account-platform-select"></select>
        <input type="text" name="login" id="account-login" placeholder="Login (Kontonummer)">
        <input type="password" name="password" id="account-password" placeholder="Passwort (Read-Only / Investor)">
        <input type="text" name="server" id="account-server" placeholder="Server (z. B. FTMO-Server)">
        <input type="number" name="starting_balance" id="account-starting-balance" placeholder="Startkapital (z. B. 10000)" step="0.01">
        <button type="submit" class="btn btn-primary">Konto speichern</button>
      </form>
      <div class="account-hint" id="account-hint">
        Nutze ausschließlich das Investor-/Read-Only-Passwort. Zugangsdaten werden nur lokal
        in deiner SQLite-Datenbank gespeichert und nie an Dritte übertragen.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Verbundene Konten</div>
      <div class="account-list" id="account-list"></div>
    </div>
  </section>
</template>

<template id="tpl-settings">
  <section class="view">
    <header class="view-header">
      <h1>Einstellungen</h1>
    </header>

    <div class="card">
      <div class="card-title">Schriftart</div>
      <div class="font-grid" id="font-grid"></div>
    </div>

    <div class="card">
      <div class="card-title">Konto löschen</div>
      <div class="account-form">
        <select id="settings-account-select"></select>
        <button type="button" class="btn btn-danger" id="settings-account-delete-btn">Konto löschen</button>
      </div>
      <div class="account-hint" id="settings-account-hint"></div>
    </div>

    <div class="card">
      <div class="card-title">Tags</div>
      <div class="account-hint">
        Ordne Trades in der Tagesansicht per Tag-Symbol eigene Tags zu (z. B. Strategie oder Fehler)
        und filtere später auf der Trades-Seite danach - mehrere gleichzeitig, wahlweise UND/ODER verknüpft.
      </div>
      <form class="tag-form" id="tag-form">
        <input type="text" name="name" id="tag-name-input" placeholder="Tag-Name (z. B. Winner)" autocomplete="off" required>
        <input type="text" name="tag_group" id="tag-group-input" placeholder="Gruppe (optional, z. B. Strategie)" list="tag-group-options" autocomplete="off">
        <datalist id="tag-group-options"></datalist>
        <div class="tag-swatch-row" id="tag-swatch-row"></div>
        <input type="color" id="tag-color-input" value="#6c95ff" title="Eigene Farbe">
        <button type="submit" class="btn btn-primary" id="tag-form-submit">Tag anlegen</button>
        <button type="button" class="btn btn-secondary" id="tag-form-cancel" hidden>Abbrechen</button>
      </form>
      <div class="tag-list" id="tag-list"></div>
    </div>

    <div class="card" id="journal-templates-card">
      <div class="card-title">Journal-Vorlagen</div>
      <div class="account-hint">
        Vorlagen fügst du im Journal mit einem Klick in den Eintrag ein. Bearbeite sie so,
        dass sie zu deinem Ablauf passen – die Struktur ist der halbe Journal-Erfolg.
      </div>
      <form class="tag-form" id="journal-tpl-form">
        <input type="text" id="journal-tpl-name" placeholder="Name (z. B. Pre-Session)" required>
        <button type="submit" class="btn btn-primary" id="journal-tpl-submit">Vorlage anlegen</button>
        <button type="button" class="btn btn-secondary" id="journal-tpl-cancel" hidden>Abbrechen</button>
      </form>
      <div class="journal-tpl-editor-host" id="journal-tpl-editor"></div>
      <div class="tag-list" id="journal-tpl-list"></div>
    </div>
  </section>
</template>


<script src="vendor/quill.js"></script>
<script src="app.js"></script>
</body>
</html>
